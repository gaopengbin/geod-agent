title = "GeoD Agent source secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Local request IDs and credential revision UUIDs are correlation metadata, not credentials"
regexTarget = "match"
regexes = [
  '''(?i)(idempotencyKey|credentialRefVersion)"\s*:\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"'''
]
