[package]
name = "geod-task-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic local task planning for GeoD Agent"

[dependencies]
geod-core = { path = "../geod-core" }
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
