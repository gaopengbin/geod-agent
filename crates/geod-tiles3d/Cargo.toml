[package]
name = "geod-tiles3d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent 3D Tiles downloader and verifiable offline bundles for GeoD Agent"

[dependencies]
futures-util = "0.3"
geo = "0.31"
geod-core = { path = "../geod-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
flate2 = "1"
tiny_http = "0.12"
