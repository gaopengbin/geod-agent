# Add these locations inside the geod.laogao.xyz HTTPS server's existing
# /srv/laogao/config/geod/routes.conf after the new services pass loopback checks.
# The website's fallback `location /api/ { return 404; }` remains in place.

location = /api/geod/oauth/authorize {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:9114;
    include /srv/laogao/config/geod/proxy.conf;
}

location = /api/geod/oauth/token {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:9114;
    include /srv/laogao/config/geod/proxy.conf;
}

location = /api/geod/oauth/revoke {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:9114;
    include /srv/laogao/config/geod/proxy.conf;
}

# The gateway alone calls introspect directly on 127.0.0.1:9114.
location ^~ /api/geod/oauth/ { return 404; }

location ^~ /api/agent/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:9115;
    include /srv/laogao/config/geod/proxy.conf;
}
