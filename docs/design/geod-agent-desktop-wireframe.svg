  <text x="1030" y="257" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#304156">成都市 · 已画边界</text>
  <rect x="400" y="805" width="748" height="91" rx="15" fill="#F7F9FC" stroke="#E6EDF6"/>
