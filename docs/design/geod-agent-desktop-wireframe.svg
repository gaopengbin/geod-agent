    <text x="1154" y="44">任务历史</text><text x="1253" y="44">图源</text><text x="1320" y="44">帮助</text>
  </g>
  <circle cx="1534" cy="36" r="20" fill="#E6F0FF"/><text x="1525" y="43" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1769E8">高</text>

