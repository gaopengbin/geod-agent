<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">GeoD Agent 桌面工作区视觉示意</title>
  <desc id="desc">左侧是任务对话，中间是带瓦片格网和裁剪边界的地图，右侧是待确认下载计划。所有地图和数字均为示意。</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11BBE9"/><stop offset=".45" stop-color="#1875F0"/><stop offset="1" stop-color="#0637B0"/></linearGradient>
    <pattern id="tiles" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#1875F0" stroke-width="1.5" stroke-opacity=".4"/></pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C8D8EC" stroke-width="1" stroke-opacity=".45"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#284C7E" flood-opacity=".08"/></filter>
    <clipPath id="mapClip"><rect x="375" y="188" width="798" height="588" rx="16"/></clipPath>
  </defs>
