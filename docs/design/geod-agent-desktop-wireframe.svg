    <text x="1222" y="465" font-size="12" fill="#7A8796">输出</text><text x="1222" y="489" font-size="15" font-weight="650" fill="#202A3A">GeoTIFF + 离线瓦片包</text>
  </g>
  <path d="M1222 519H1552" stroke="#E8EDF4"/>
  <text x="1222" y="551" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#304156">资源估算</text>
