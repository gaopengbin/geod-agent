    <path d="M635 386 767 335 913 352 1036 431 1010 557 894 642 742 603 638 510Z" fill="#1769E8" fill-opacity=".17" stroke="#1769E8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M635 386 767 335 913 352 1036 431 1010 557 894 642 742 603 638 510Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="6 7"/>
