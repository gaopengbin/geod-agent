  <text x="48" y="171" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="760" fill="#202A3A">下载并裁剪影像</text>
  <text x="48" y="197" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#7A8796">今天 14:32 · 计划等待确认</text>
  <path d="M48 216H327" stroke="#E8EDF4"/>
  <rect x="48" y="238" width="276" height="89" rx="14" fill="#F5F8FC"/>
  <text x="64" y="264" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#596A7B">你</text>
  <text x="64" y="287" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#202A3A">用我的影像源下载成都市这块</text>
  <text x="64" y="309" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#202A3A">范围，15 级，按边界裁剪。</text>
  <circle cx="62" cy="361" r="14" fill="url(#blue)"/>
  <text x="57" y="366" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#fff">G</text>
  <text x="85" y="366" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#304156">GeoD Agent</text>
  <text x="48" y="399" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#405064">我已根据你画的范围生成计划。</text>
  <text x="48" y="425" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#405064">预计 192 块瓦片，输出约 220 MB。</text>
  <text x="48" y="451" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#405064">请在右侧检查图源和保存位置。</text>
